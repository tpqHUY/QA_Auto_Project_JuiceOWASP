name: smoke

# Fast feedback on every push / PR: spin up Juice Shop in Docker and run the
# @smoke suite on chromium. Full cross-browser regression runs nightly (week 5).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binaries between runs (keyed on the pinned
      # @playwright/test version in the lockfile).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + OS deps)
        run: npx playwright install --with-deps chromium

      - name: Start Juice Shop
        run: docker compose up -d

      - name: Wait for Juice Shop to be ready
        run: npm run app:wait

      - name: Run @smoke suite (chromium)
        run: npx playwright test --grep @smoke --project=chromium

      - name: Tear down Juice Shop
        if: always()
        run: docker compose down

      # On failure, publish the HTML report + traces/screenshots/videos so a
      # failing run is debuggable straight from the Actions UI.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
