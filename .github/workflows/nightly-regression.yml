name: nightly-regression

# Full @regression suite across all three browser engines every night, with an
# Allure trend report deployed to GitHub Pages via the official Pages action
# (Settings → Pages → Source: "GitHub Actions"). Smoke (chromium) runs per-push
# in smoke.yml; this is the deep, cross-browser safety net.
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC ≈ 01:00 Vietnam time
  workflow_dispatch:

# Permissions required by the official GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments run at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.regression.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Allure report generation needs a JRE)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (all engines + OS deps)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Juice Shop
        run: docker compose up -d

      - name: Wait for Juice Shop to be ready
        run: npm run app:wait

      # Carry Allure trend history across runs (unique key each run, restore the
      # most recent) so the report shows pass/fail trends over time.
      - name: Restore Allure history
        uses: actions/cache@v4
        with:
          path: allure-history-store
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      # Fresh container ⇒ full product stock, so cross-browser ordering tests
      # never hit Juice Shop's finite stock (see docs/exploratory-notes.md).
      - name: Run @regression across all browsers
        id: regression
        run: npx playwright test --grep @regression
        continue-on-error: true

      - name: Tear down Juice Shop
        if: always()
        run: docker compose down

      - name: Generate Allure report (preserving trend history)
        if: always()
        run: |
          if [ -d allure-history-store ]; then
            cp -r allure-history-store allure-results/history
          fi
          npx allure generate allure-results --clean -o allure-report
          rm -rf allure-history-store
          cp -r allure-report/history allure-history-store

      - name: Upload report as the Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Upload raw reports as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            allure-report/
            playwright-report/
          retention-days: 14

  # Deploy the Allure report to GitHub Pages (always — a failing run is still
  # inspectable at the public URL).
  deploy:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Make the overall run red if any test failed (report is already deployed).
  status:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if regression failed
        if: needs.regression.outputs.result == 'failure'
        run: |
          echo "Regression suite had failures — see the published Allure report."
          exit 1
